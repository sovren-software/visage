[workspace]
resolver = "2"
members = [
    "crates/visaged",
    "crates/pam-visage",
    "crates/visage-cli",
    "crates/visage-core",
    "crates/visage-hw",
    "crates/visage-models",
    "crates/visage-ipc",
    "crates/visage-tui",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sovren-software/visage"
# Measured 2026-08-24, not guessed: `ort` and `image` both declare 1.88, and 59
# packages in the resolved graph require > 1.75. The previous value of 1.75 was
# not stale — it was false. The crate could not build on it, and anyone who
# trusted the field got a failure deep inside a dependency instead of a clear
# "your toolchain is too old". The `msrv` CI job now verifies this.
#
# Raised to 1.89 on 2026-11-09: `rusqlite` 0.41.0 and 0.41.1 both declare 1.89
# in their manifests (read with `cargo info`), although the 0.41.0 release note
# says "Lower MSRV to 1.88.0". 0.41 is the only line that carries the
# bundled-SQLite fix for RUSTSEC-2026-0459.
rust-version = "1.89"

[workspace.dependencies]
# Terminal UI. `ratatui` re-exports the `crossterm` it was built against, so
# depending on crossterm separately is how you get two incompatible versions.
ratatui = "0.30"

# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus IPC.
# Pin to the tokio executor and disable the default `async-io` feature (zbus's
# own recommendation for tokio integration). `visaged` awaits tokio primitives
# (mpsc/oneshot/Mutex) from inside `#[zbus::interface]` handlers; leaving zbus on
# its default async-io executor makes any reactor-bound tokio call (e.g. a future
# `tokio::time`) panic with "no reactor running". Keeping this on tokio also
# prevents a transitive dep from silently reverting the whole process to async-io
# via Cargo feature unification. `pam-visage` re-adds `blocking-api` for its
# synchronous proxy (it drives zbus's internal tokio runtime via `block_on`).
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Storage
rusqlite = { version = "0.41", features = ["bundled"] }

# Identity / time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = "0.25"

# ONNX inference
ort = "2.0.0-rc.11"
ndarray = "0.17"
# Optional GPU inference (visage-core feature `openvino`). `runtime-linking`
# loads libopenvino_c at runtime instead of at build time, so the feature adds
# no hard runtime dependency.
openvino = { version = "0.11", features = ["runtime-linking"] }

# Cryptography (embedding encryption)
aes-gcm = "0.10"
rand = "0.9"
sha2 = "0.10"

# FFI / system
libc = "0.2"
nix = "0.31"
